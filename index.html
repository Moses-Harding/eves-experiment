<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eve's Experiment</title>
<meta name="description" content="Set up a level, then follow a step-by-step solution that adapts as hidden layers are revealed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bench:#DCE4E2; --paper:#F4F7F6; --ink:#15232A; --muted:#566870; --line:#B9C6C4;
  --act:#0E5B70; --act-ink:#FFFFFF; --glass:rgba(255,255,255,.55); --glass-edge:#8FA3A6; --hidden:#2A3A40;
  --src:#E8A33A; --dst:#0E8FAE; --bad:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bench:#0F181C; --paper:#172329; --ink:#E4EDEF; --muted:#93A6AC; --line:#2C3D44;
  --act:#5CC3DD; --act-ink:#08262E; --glass:rgba(255,255,255,.06); --glass-edge:#4E6369; --hidden:#0A1115; --bad:#FF8A80;
}}
:root[data-theme="dark"]{
  --bench:#0F181C; --paper:#172329; --ink:#E4EDEF; --muted:#93A6AC; --line:#2C3D44;
  --act:#5CC3DD; --act-ink:#08262E; --glass:rgba(255,255,255,.06); --glass-edge:#4E6369; --hidden:#0A1115; --bad:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bench);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:700;font-size:clamp(32px,9vw,48px);line-height:1;letter-spacing:-.02em;margin:8px 0 8px}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;max-width:48ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px}
.panel+.panel{margin-top:14px}
.row{display:flex;justify-content:center;gap:clamp(5px,2vw,14px)}
.row+.row{margin-top:18px}
.tube{appearance:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font:inherit;transition:transform .25s ease;cursor:pointer}
.tube:focus-visible{outline:none}
.tube:focus-visible .glass{outline:3px solid var(--act);outline-offset:3px}
.glass{width:clamp(38px,11vw,52px);border:2px solid var(--glass-edge);border-top-width:3px;border-radius:6px 6px 24px 24px;background:var(--glass);overflow:hidden;display:flex;flex-direction:column-reverse}
.cell{height:clamp(34px,9.5vw,44px);flex:none;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;color:#fff}
.cell.h{background:var(--hidden);color:rgba(255,255,255,.8)}
.cell.new{animation:fill .45s ease-out}
@keyframes fill{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1)}}
.num{font-size:13px;color:var(--muted);font-weight:700}
.tube.src{transform:translateY(-12px)}
.tube.src .glass{border-color:var(--src);box-shadow:0 0 0 3px color-mix(in srgb,var(--src) 35%,transparent)}
.tube.dst .glass{border-color:var(--dst);box-shadow:0 0 0 3px color-mix(in srgb,var(--dst) 35%,transparent)}
.tube.src .num{color:var(--src)} .tube.dst .num{color:var(--dst)}
.tube.sel .glass{outline:3px dashed var(--ink);outline-offset:3px}
.tube.ask .glass{border-color:var(--act);box-shadow:0 0 0 4px color-mix(in srgb,var(--act) 40%,transparent)}
.tube.bad .glass{border-color:var(--bad)}
/* editor */
.edit .tube{cursor:default}
.slot{appearance:none;border:0;border-top:1px dashed color-mix(in srgb,var(--glass-edge) 60%,transparent);padding:0;margin:0;width:100%;cursor:pointer;font:inherit;background:transparent}
.slot:first-child{border-top:0}
.slot:focus-visible{outline:3px solid var(--act);outline-offset:-3px}
.slot.empty:hover{background:color-mix(in srgb,var(--act) 12%,transparent)}
.brushes{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:10px}
.brush{appearance:none;font:inherit;height:46px;border-radius:12px;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.brush:focus-visible{outline:3px solid var(--act);outline-offset:3px}
.brush.q{background:var(--hidden)}
.brush.erase{background:transparent;color:var(--ink);border:2px dashed var(--line);font-size:14px}
.brush.erase[aria-pressed="true"]{border-style:solid;border-color:var(--ink)}
.brushname{margin:8px 0 0;font-size:14px;color:var(--muted);min-height:1.5em}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:1;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:3px solid var(--act);outline-offset:2px}
.slot.unsure{outline:3px dotted var(--src);outline-offset:-3px}
.shot .note{margin-top:10px}
.palette{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;padding:10px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 18%,transparent)}
.palette .brushes{grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin-top:0}
.palette .brush{height:clamp(30px,8.4vw,40px);border-radius:9px;font-size:17px}
.palette .brush.erase{font-size:12px}
.palette .brush{touch-action:none;user-select:none;-webkit-user-select:none}
.ghost{position:fixed;left:0;top:0;width:40px;height:40px;border-radius:10px;pointer-events:none;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:#fff;font-size:20px;transform:translate(-50%,-120%)}
.slot.drop{outline:3px solid var(--act);outline-offset:-3px}
.tube.drop .glass{border-color:var(--act);box-shadow:0 0 0 3px color-mix(in srgb,var(--act) 35%,transparent)}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.palette .brushname{margin:6px 2px 0;font-size:13px}

.steppers{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper span{color:var(--muted);font-size:15px}
.stepper output{font-weight:700;min-width:1.6em;text-align:center}
.mini{appearance:none;font:inherit;font-weight:700;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mini:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.check p{margin:0 0 6px}
.check .errs{color:var(--bad);font-weight:700;margin:0;padding-left:1.1em}
.check .errs li{margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips b{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:14px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid var(--line)}
.chips b span{width:16px;height:16px;border-radius:50%;flex:none}
.stripe{background:repeating-linear-gradient(45deg,#8A949A 0 4px,#B9C2C6 4px 8px)!important}
/* walkthrough */
.count{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--act);transition:width .4s}
.say{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(21px,5.6vw,26px);line-height:1.2;margin:0 0 6px}
.why{margin:0;color:var(--muted)}
.chip{display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-.08em;margin-right:.25em;border:1px solid rgba(0,0,0,.2)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.b,label.b{font:inherit;font-weight:700;border-radius:14px;padding:13px 18px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
button.b.go,label.b.go{flex:1;background:var(--act);color:var(--act-ink);border-color:var(--act)}
button.b:disabled{opacity:.4;cursor:default}
button.b:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.pick{display:flex;align-items:center;gap:10px;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.pick span{width:26px;height:26px;border-radius:7px;flex:none;border:1px solid rgba(0,0,0,.2)}
.pick:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.note{font-size:14px;color:var(--muted);margin:12px 0 0;min-height:1.5em}
.pool{margin-top:16px;font-size:14px;color:var(--muted)}
/* screenshot preview, shown beside the board it produced */
.editwrap{display:flex;flex-direction:column;gap:16px;min-width:0}
.boardcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.solveslot{margin-top:0}
.shotPreview{border:1px solid var(--line);border-radius:16px;padding:10px;background:color-mix(in srgb,var(--bench) 45%,transparent);min-width:0}
.shotHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.shotHead span{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px}
.xbtn{appearance:none;font:inherit;font-weight:700;font-size:18px;line-height:1;width:30px;height:30px;flex:none;border-radius:9px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.xbtn:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.shotPreview img{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--hidden);cursor:zoom-in}
.shotPreview.zoom img{max-height:none;cursor:zoom-out}
.shotPreview .why{margin:8px 0 0;font-size:14px}
.rowfix{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:13px;border:1.5px solid var(--act);background:color-mix(in srgb,var(--act) 12%,transparent)}
.rowfix span{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:17px;line-height:1.2;color:var(--ink)}
.rowfix .mini{border-color:var(--act);color:var(--ink)}
.rowfix output{font-size:19px}
.delTube{appearance:none;font:inherit;font-weight:700;line-height:1;width:22px;height:22px;margin-top:2px;padding:0;border-radius:7px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;opacity:.55}
.delTube:hover:not(:disabled){opacity:1;border-color:var(--bad);color:var(--bad)}
.delTube:focus-visible{outline:3px solid var(--act);outline-offset:2px;opacity:1}
.delTube:disabled{opacity:.15;cursor:default}

.tips{margin:10px 0 0;padding-left:1.15em;font-size:14px;color:var(--muted)}
.tips li{margin-bottom:4px}
/* pour arrow + the layer being asked about + its colour menu */
#walkBench{position:relative;padding-top:30px}  /* headroom for the pour arrow */
.arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arrow path{fill:none;stroke:var(--act);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.arrow .head{fill:var(--act);stroke:none}
.cell.askcell{outline:3px solid var(--act);outline-offset:-3px;animation:askpulse 1.5s ease-in-out infinite}
@keyframes askpulse{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 7px color-mix(in srgb,var(--act) 45%,transparent)}}
.ctxmenu{position:absolute;z-index:6;display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 8px);gap:6px;padding:7px;border-radius:13px;background:var(--paper);border:1.5px solid var(--act);box-shadow:0 12px 30px color-mix(in srgb,var(--ink) 34%,transparent)}
.cpick{appearance:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;flex:none}
.cpick span{width:24px;height:24px;border-radius:6px;flex:none;border:1px solid rgba(0,0,0,.2)}
.cpick:hover{border-color:var(--act)}
.cpick.off{opacity:.34}
.cpick.off:hover{opacity:.6}
.cdiv{flex:0 0 100%;height:1px;margin:3px 2px;background:var(--line)}
.cpick:focus-visible{outline:3px solid var(--act);outline-offset:2px}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- desktop: spread across two columns instead of one tall one ---- */
@media (min-width:900px){
  main{max-width:1180px;padding:28px 24px 64px}
  h1{font-size:44px}
  .sub{max-width:62ch}

  #setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,350px);column-gap:20px;row-gap:14px;align-items:start}
  #setup>h1{grid-column:1/-1;grid-row:1}
  #setup>.sub{grid-column:1/-1;grid-row:2;margin-bottom:0}
  #setup>.panel.editor{grid-column:1;grid-row:3/span 3}
  #setup>.panel.shot{grid-column:2;grid-row:3}
  #setup>.panel.palette{grid-column:2;grid-row:4}
  #setup>.panel.check{grid-column:2;grid-row:5}
  #setup>.panel+.panel{margin-top:0}

  /* the board and its source screenshot sit side by side */
  .editwrap{flex-direction:row;align-items:flex-start;gap:20px}
  .editwrap>.boardcol{flex:1 1 auto;min-width:0}
  .shotPreview{flex:0 1 310px;align-self:flex-start}
  .shotPreview img{max-height:440px}

  /* no longer thumb-reach furniture, so let it sit in the column */
  .palette{position:static;bottom:auto;box-shadow:none}
  .palette .brushes{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .palette .brush{height:42px;border-radius:11px;font-size:19px}
  .palette .brush.erase{font-size:13px}

  #walk{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);column-gap:20px;align-items:start}
  #walk>h1{grid-column:1/-1;grid-row:1}
  #walk>.sub{grid-column:1/-1;grid-row:2}
  #walk>.banner{grid-column:1/-1;grid-row:3}
  #walk>.panel.bench{grid-column:1;grid-row:4}
  #walk>.panel.steps{grid-column:2;grid-row:4}
  #walk>.ctrl{grid-column:2;grid-row:5;margin-top:14px}
  #walk>.panel+.panel{margin-top:0}
}
.lang{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-width:380px;margin:0 0 18px;padding:5px;border-radius:999px;background:var(--paper);border:2px solid var(--ink)}
.lang button{appearance:none;font:inherit;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:19px;padding:12px 10px;border-radius:999px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.banner{margin:0 0 14px;padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--act) 14%,var(--paper));border:1px solid var(--act)}
</style>
</head>
<body>
<main>
<div class="lang" role="group" aria-label="Instructions language / Langue des instructions">
  <button type="button" data-lang="en">English</button>
  <button type="button" data-lang="fr">Français</button>
</div>

<!-- ============ SET UP ============ -->
<section id="setup">
  <h1>Eve's Experiment</h1>
  <p class="sub" data-i="sub"></p>

  <div class="panel shot">
    <h2 data-i="shotH"></h2>
    <p class="why" data-i="shotWhy"></p>
    <div class="ctrl">
      <label class="b go filebtn"><input type="file" id="shotInput" accept="image/*"><span data-i="shotBtn"></span></label>
    </div>
    <p class="note" id="shotNote" role="status"></p>
    <ul class="tips" id="shotTips" hidden><li data-i="tipCrop"></li><li data-i="tipColors"></li></ul>
  </div>

  <div class="panel editor">
    <div class="steppers">
      <div class="stepper"><span data-i="tubes"></span><button class="mini" id="fewer" data-d="-1">−</button><output id="nTubes"></output><button class="mini" id="more" data-d="1">+</button></div>
    </div>
    <div class="editwrap">
      <div class="boardcol">
        <div class="edit" id="editBench"></div>
        <div class="ctrl solveslot" id="solveSlot" hidden></div>
      </div>
      <div class="shotPreview" id="shotPreview" hidden>
        <div class="shotHead"><span data-i="previewCap"></span><button type="button" class="xbtn" id="shotClose">×</button></div>
        <img id="shotImg" alt="">
        <p class="why" data-i="previewHint"></p>
        <div class="rowfix">
          <span data-i="rowsWrong"></span>
          <div class="stepper"><button class="mini" id="rowsFewer" data-d="-1">−</button><output id="rowsN"></output><button class="mini" id="rowsMore" data-d="1">+</button></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel palette">
    <div class="brushes" id="brushes" role="group"></div>
    <p class="brushname" id="brushName"></p>
  </div>

  <div class="panel check" aria-live="polite">
    <div id="checkBody"></div>
    <div class="ctrl" id="checkCtrl">
      <button class="b" id="clearBoard" data-i="clear"></button>
      <button class="b" id="exampleBoard" data-i="example"></button>
      <button class="b go" id="startWalk" data-i="solve"></button>
    </div>
  </div>

</section>

<!-- ============ WALKTHROUGH ============ -->
<section id="walk" hidden>
  <h1>Eve's Experiment</h1>
  <p class="sub" data-i="walkSub"></p>
  <p class="banner" id="banner" hidden></p>
  <div class="panel bench"><div id="walkBench"></div></div>
  <div class="panel steps" aria-live="polite">
    <div class="count"><span id="cnt"></span><span id="tubesDone"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="body"></div>
    <div class="ctrl">
      <button class="b" id="back" data-i="back"></button>
      <button class="b go" id="next"></button>
    </div>
    <p class="note" id="note"></p>
    <div class="pool" id="pool"></div>
  </div>
  <div class="ctrl"><button class="b" id="editAgain" data-i="edit"></button><button class="b" id="reshoot" data-i="reshoot"></button></div>
</section>

</main>

<script>
// Water-sort solver core. Works in Node (require) and in the browser (inlined; defines makeSolver).
// State: array of tubes, each an array of color codes bottom->top. Hidden layers are "?<id>".
function makeSolver(CAP, pool, unseen) {
  unseen = unseen || []; // codes for colors not visible anywhere at the start; interchangeable until revealed
  const isH = c => c[0] === '?';
  const key = t => t.map(x => x.join(',')).join('|');
  const ckey = t => t.map(x => x.join(',')).sort().join('|');
  function topRun(x) { if (!x.length) return [null, 0]; const c = x[x.length - 1]; if (isH(c)) return [c, 0]; let n = 0; for (let i = x.length - 1; i >= 0 && x[i] === c; i--) n++; return [c, n]; }
  function canPour(t, a, b) {
    if (a === b) return 0; const A = t[a], B = t[b]; if (!A.length) return 0;
    const [c, n] = topRun(A); if (!n || B.length >= CAP) return 0;
    if (B.length && B[B.length - 1] !== c) return 0;
    if (!B.length && n === A.length) return 0; // pointless: a whole single-color tube into an empty one
    return Math.min(n, CAP - B.length);
  }
  const apply = (t, a, b, k) => { const n = t.map(x => x.slice()); for (let i = 0; i < k; i++) n[b].push(n[a].pop()); return n; };
  function moves(t) { const r = [], fe = t.findIndex(x => !x.length); for (let a = 0; a < t.length; a++) for (let b = 0; b < t.length; b++) { const k = canPour(t, a, b); if (k && (t[b].length || b === fe)) r.push([a, b, k]); } return r; }
  const solved = t => t.every(x => !x.length || (x.length === CAP && x.every(c => c === x[0] && !isH(c))));
  const EMPTY = 7 * CAP; // how much the planner values keeping a tube empty

  function planSegment(st, constraint, visited, maxWorlds, deadline) {

  const pool=[]; Object.keys(counts).forEach(c=>{for(let k=counts[c];k<CAP;k++) pool.push('c'+c);}); U.forEach(u=>{for(let k=0;k<CAP;k++) pool.push(u);});
  let id=0; const start=tubes.map(t=>t.map(v=>v==='?'?'?'+(id++):'c'+v));
  out.puzzle={start,pool,colors,unseen:U,rows:rowsFor(ED.cells.length)};
  if(!hidden){ const sv=makeSolver(CAP,pool,U); if(!sv.solvable(start)) errors.push({k:['unsolvable']}); }
  return out;
}

// ---------------- screenshot reader ----------------
// Tuned for this game's layout: finds each tube by its bright glass lip, splits the tube into
// equal layers, and classifies the middle of each layer as a color, a hidden "?", or empty.
const REC={
  W:390,
  // Colors as the game draws them, measured from real screenshots, mapped to palette indices.
  refs:[[1,[226,135,45]],[11,[156,12,120]],[8,[69,59,194]],[0,[190,48,38]],[4,[65,198,106]],
        [12,[225,98,124]],[14,[118,77,30]],[5,[29,87,33]],[13,[114,35,56]],[7,[92,161,224]]],
};
function toLab([r,g,b]){
  const f=c=>{c/=255;return c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92;};
  const R=f(r),G=f(g),B=f(b);
  let x=(0.4124*R+0.3576*G+0.1805*B)/0.95047, y=0.2126*R+0.7152*G+0.0722*B, z=(0.0193*R+0.1192*G+0.9505*B)/1.08883;
  const h=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116; x=h(x);y=h(y);z=h(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const dLab=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
function readScreenshot(img,cap,want){  // want: the row count the user says the board has
  if(img.naturalWidth<300) return {error:'tooSmall'};
  const W=REC.W, H=Math.round(img.naturalHeight*W/img.naturalWidth);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true}); cx.imageSmoothingQuality='high'; cx.drawImage(img,0,0,W,H);
  const D=cx.getImageData(0,0,W,H).data;
  const px=(x,y)=>{const i=(y*W+x)*4;return [D[i],D[i+1],D[i+2]];};
  const satOf=p=>{const m=Math.max(...p);return m?(m-Math.min(...p))/m:0;};
  // 1. lips: short bright, low-saturation horizontal runs.
  // Scan nearly the whole image: a three-row board starts higher up than a two-row one, and a
  // narrow band silently drops the top row. Chrome is rejected by the width filter below instead.
  const segs=[];
  for(let y=Math.floor(H*0.03);y<Math.floor(H*0.98);y++){
    let x=0;
    while(x<W){
      const p=px(x,y), br=(p[0]+p[1]+p[2])/3>90&&satOf(p)<0.35;
      if(!br){x++;continue;}
      let s=x,e=x,gap=0;
      while(x<W&&gap<=3){ const q=px(x,y); if((q[0]+q[1]+q[2])/3>90&&satOf(q)<0.35){e=x;gap=0;} else gap++; x++; }
      const L=e-s+1; if(L>=0.07*W&&L<=0.17*W) segs.push({y,s,e});
    }
  }
  const over=(a,b,w)=>Math.min(a.e,b.e)-Math.max(a.s,b.s)>0.5*w;
  const near=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2])<26;
  const tubes=[];
  for(const g of segs){ const w=g.e-g.s+1;
    // the same lip found again on the next scan line
    if(tubes.some(t=>over(g,t,w)&&g.y-t.y<=0.25*w)) continue;
    // A bright run directly below a known tube is either that tube's own bottom edge or the lip
    // of the row beneath it. Distinguishing them by distance alone is what dropped whole rows:
    // a row's pitch and a tube's height are too close together. Look at what is immediately
    // above the run instead -- background means a gap between rows, anything else means we are
    // still inside the tube. Comparing against background sampled beside the run (rather than
    // testing for liquid) keeps dark hidden layers on the correct side of the question.
    if(tubes.some(t=>over(g,t,w)&&g.y-t.y<=5.5*w)){
      const xm=(g.s+g.e)>>1, xo=g.s-Math.max(2,Math.round(0.1*w));
      let gapFound=false;
      // Walk up from the run looking for even a thin band of background. Rows can be packed
      // tightly, so a single fixed sample height either lands past a narrow gap or stops short
      // of a wide one; comparing against background taken from beside the tube at the same
      // height keeps a dark hidden layer from reading as background.
      for(let d=2;d<=Math.round(0.55*w);d++){
        const y=g.y-d; if(y<0) break;
        if(xo>=0&&near(px(xm,y),px(xo,y))){ gapFound=true; break; }
      }
      if(!gapFound) continue;
    }
    tubes.push(g); }
  if(tubes.length<3) return {error:'noTubes'};
  // Every tube on the board is the same width, so anything of a different width is not a tube:
  // status bar icons, buttons, banners. This is what lets the scan above cover the full image.
  const wSorted=tubes.map(t=>t.e-t.s+1).sort((a,b)=>a-b), wMed=wSorted[wSorted.length>>1];
  const board=tubes.filter(t=>Math.abs((t.e-t.s+1)-wMed)<=0.22*wMed);
  if(board.length<3) return {error:'noTubes'};
  board.sort((a,b)=>a.y-b.y||a.s-b.s);
  const rows=[];
  for(const t of board){ const r=rows[rows.length-1]; if(r&&Math.abs(r[0].y-t.y)<=8) r.push(t); else rows.push([t]); }
  rows.forEach(r=>r.sort((a,b)=>a.s-b.s));
  // Tube rows sit on an evenly spaced grid; a header badge or a button bar does not. Keep the
  // run of rows whose spacing is consistent and which accounts for the most tubes, which drops
  // the game's own chrome without needing a fixed crop of the image to guess where it is.
  if(rows.length>1){
    // Tubes in a row are evenly spaced on the board's columns. A row of controls is not, so a
    // row whose own spacing disagrees with the fullest row's is chrome, however tube-like its
    // pieces look on their own.
    const anchor=rows.reduce((a,b)=>b.length>a.length?b:a);
    const spacing=r=>{ const d=[]; for(let i=1;i<r.length;i++) d.push(r[i].s-r[i-1].s);
      d.sort((a,b)=>a-b); return d.length?d[d.length>>1]:0; };
    const dx=spacing(anchor);
    if(dx>0){ const kept=rows.filter(r=>r.length<2||Math.abs(spacing(r)-dx)<=0.25*dx);
      if(kept.length){ rows.length=0; rows.push(...kept); } }
    const ys=rows.map(r=>r[0].y);
    // The best run of evenly spaced rows at a given tolerance, optionally of an exact length.
    // Tubes fill left to right and top to bottom, so every row of a board is full except
    // possibly the last. A short row anywhere but the end is therefore not part of the board:
    // it is a stray piece of the game's interface that happens to look tube-sized.
    const shapeOK=win=>{ const m=Math.max(...win.map(r=>r.length));
      return win.every((r,i)=>i===win.length-1?r.length<=m:r.length===m); };
    const runAt=tol=>{
      let best=null, bestShaped=null;
      for(let i=0;i+1<rows.length;i++){
        const pitch=ys[i+1]-ys[i]; if(pitch<=0) continue;
        for(let a=0;a<rows.length;a++){
          let b=a, n=rows[a].length;
          while(b+1<rows.length&&Math.abs((ys[b+1]-ys[b])-pitch)<=tol*pitch){ b++; n+=rows[b].length; }
          if(b<=a) continue;
          const cand={a,b,n};
          if(!best||n>best.n) best=cand;
          if(shapeOK(rows.slice(a,b+1))&&(!bestShaped||n>bestShaped.n)) bestShaped=cand;
        }
      }
      return bestShaped||best;
    };
    let keep=null;
    if(want>0&&want<=rows.length){
      // The user has said how many rows the board has, so consider every block of that many
      // adjacent rows and take the most evenly spaced one. Picking the block with the most tubes
      // instead let a one-element chrome row stand in for a real row of one tube: both give the
      // same row count, and a badge above the board happened to win. Even spacing tells them
      // apart, because a chrome row does not sit on the board's pitch.
      let best=null, bestShaped=null;
      for(let a=0;a+want<=rows.length;a++){
        const win=rows.slice(a,a+want), gaps=[];
        for(let i=1;i<win.length;i++) gaps.push(win[i][0].y-win[i-1][0].y);
        const mean=gaps.length?gaps.reduce((x,y)=>x+y,0)/gaps.length:1;
        const dev=gaps.length?Math.max(...gaps.map(g=>Math.abs(g-mean)))/mean:0;
        const n=win.reduce((x,r)=>x+r.length,0);
        const better=(c,o)=>!o||c.dev<o.dev-1e-9||(Math.abs(c.dev-o.dev)<1e-9&&c.n>o.n);
        const cand={a,dev,n};
        if(better(cand,best)) best=cand;
        if(shapeOK(win)&&better(cand,bestShaped)) bestShaped=cand;
      }
      const pick=bestShaped||best;
      if(pick) keep=rows.slice(pick.a,pick.a+want);
    }
    if(!keep){ const b=runAt(0.18);
      if(b) keep=rows.slice(b.a,b.b+1);
      else { const m=Math.max(...rows.map(r=>r.length)); keep=rows.filter(r=>r.length===m); } }
    rows.length=0; rows.push(...keep);
  }
  // 2. layer height per row, refined from color boundaries
  const out=[], unsure=[];
  const refLab=REC.refs.map(([i,rgb])=>[i,toLab(rgb)]);
  const palLab=PALETTE.map((p,i)=>[i,toLab(hexRgb(p[2]))]); // [2] is the hex; [1] is the French name
  for(const r of rows){
    const ws=r.map(t=>t.e-t.s+1).sort((a,b)=>a-b), w=ws[ws.length>>1], y0=Math.min(...r.map(t=>t.y));
    // Layer height: colored runs end on layer boundaries, at y0 + k*h. Try heights in a
    // plausible range and keep the one that lines up with the most run ends.
    const ends=[];
    for(const t of r){ const x=(t.s+t.e)>>1; let run=null;
      for(let y=y0+2;y<Math.min(H,y0+Math.round(5*w));y++){ const p=px(x,y), m=Math.max(...p);
        const col=satOf(p)>=0.42&&m>=75;
        if(col&&run&&dLab(toLab(p),run.lab)<25){ run.end=y; continue; }
        if(run&&run.end-run.start>=0.3*w) ends.push(run.end+1-y0);
        run=col?{start:y,end:y,lab:toLab(p)}:null; }
      if(run&&run.end-run.start>=0.3*w) ends.push(run.end+1-y0); }
    let h=0.9*w, bestScore=-1, bestErr=Infinity;
    for(let c=0.62*w;c<=1.2*w;c+=0.1){ let score=0, err=0;
      for(const e of ends){ const k=Math.round(e/c); if(k>=1&&k<=cap&&Math.abs(e-k*c)<=2.5){score++; err+=Math.abs(e-k*c);} }
      if(score>bestScore||(score===bestScore&&err<bestErr)){ bestScore=score; bestErr=err; h=c; } }
    // 3. classify each layer
    for(const t of r){
      const cxm=(t.s+t.e)/2, tw=t.e-t.s+1, cells=[];
      for(let i=0;i<cap;i++){
        const cy=y0+(i+0.5)*h;
        const xa=Math.floor(cxm-0.2*tw), xb=Math.floor(cxm+0.2*tw), ya=Math.floor(cy-0.22*h), yb=Math.floor(cy+0.22*h);
        if(yb>=H){cells.push(null);continue;}
        const all=[], rest=[]; let white=0;
        for(let y=ya;y<=yb;y++) for(let x=xa;x<=xb;x++){ const p=px(x,y); all.push(p);
          if((p[0]+p[1]+p[2])/3>190&&satOf(p)<0.2) white++; else rest.push(p); }
        const use=rest.length>5?rest:all, med=[0,1,2].map(c=>{const v=use.map(p=>p[c]).sort((a,b)=>a-b);return v[v.length>>1];});
        const m=Math.max(...med), s=m?(m-Math.min(...med))/m:0, wf=white/all.length;
        if(wf>=0.02&&m<120){cells.push('?');continue;}
        if(s>=0.42&&m>=75){
          const L=toLab(med), near=refLab.map(([i,l])=>[dLab(L,l),i]).sort((a,b)=>a[0]-b[0]);
          if(near[0][0]<=18){ cells.push(near[0][1]); if(near[1][0]-near[0][0]<10) unsure.push([out.length,i]); }
          else { const np=palLab.map(([i,l])=>[dLab(L,l),i]).sort((a,b)=>a[0]-b[0]); cells.push(np[0][1]); unsure.push([out.length,i]); }
          continue;
        }
        cells.push(null);
      }
      out.push(cells);
    }
  }
  return {cells:out,rows:rows.map(r=>r.length),unsure};
}


// The screenshot stays on screen beside the board so mistakes in the read are easy to spot.
let SHOT_URL=null;
// With a screenshot on screen the board is what is being checked, so Solve it belongs under it
// rather than across the page in the panel. The same button moves; it is never duplicated.
function placeSolve(){
  const onBoard=!$('shotPreview').hidden;
  $('solveSlot').hidden=!onBoard;
  (onBoard?$('solveSlot'):$('checkCtrl')).appendChild($('startWalk'));
}
// Re-run the reader on the image already on screen, telling it how many rows to look for.
// The image element holds it, so nothing needs re-uploading.
function applyRead(res){
  ED={cells:res.cells}; UNSURE.clear(); res.unsure.forEach(([t,s])=>UNSURE.add(t+','+s));
  saveEd(); renderEditor();
}
function rereadShot(delta){
  const img=$('shotImg'); if(!img||!img.naturalWidth) return;
  // The number is what the user says the board has, not a readout, so it always moves. Otherwise
  // a count that cannot be found pins the stepper and pressing + just asks for it again.
  const want=Math.max(1,Math.min(8,(+$('rowsN').textContent||1)+delta));
  $('rowsN').textContent=want;
  let res; try{ res=readScreenshot(img,CAP,want); }catch(e){ res={error:'readFail'}; }
  // A request that cannot be met leaves the board exactly as it was: falling back to the
  // automatic reading would throw away a correct board the user had already got to.
  if(res.error||res.rows.length!==want){
    shotMsg=res.error?[res.error]:['rowsNot',want];
    $('shotNote').textContent=tr(...shotMsg); return;
  }
  applyRead(res);
  shotMsg=['found',res.cells.length,UNSURE.size>0]; $('shotNote').textContent=tr(...shotMsg);
}
function showShot(url){
  if(SHOT_URL&&SHOT_URL!==url) URL.revokeObjectURL(SHOT_URL);
  SHOT_URL=url; $('shotImg').src=url;
  $('shotPreview').hidden=false; $('shotPreview').classList.remove('zoom');
  placeSolve();
}
function hideShot(){
  $('shotPreview').hidden=true; $('shotPreview').classList.remove('zoom'); $('shotImg').removeAttribute('src');
  if(SHOT_URL){ URL.revokeObjectURL(SHOT_URL); SHOT_URL=null; }
  placeSolve();
}
function loadShot(file){
  const say=(...k)=>{ shotMsg=k; $('shotNote').textContent=tr(...k); };
  $('shotTips').hidden=true;
  if(!file||!file.type.startsWith('image/')){ say('notImage'); return; }
  say('reading');
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ let res; try{ res=readScreenshot(img,CAP); }catch(e){ res={error:'readFail'}; }
    if(res.error){ URL.revokeObjectURL(url); say(res.error); return; }
    showShot(url); // kept alive, not revoked: it stays on screen next to the board for comparison
    applyRead(res); $('rowsN').textContent=res.rows.length; // seed the stepper with what was found
    $('shotTips').hidden=false;
    say('found',res.cells.length,UNSURE.size>0);
    $('editBench').scrollIntoView({behavior:'smooth',block:'center'}); };
  img.onerror=()=>{ URL.revokeObjectURL(url); say('openFail'); };

}

// ---------------- drag and drop from the palette ----------------
// A short tap selects the color; dragging drops it on a spot, or on a tube to fill its lowest empty spot.
let DR=null;
function dropTarget(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  // Dropping on a layer sets that exact layer, empty or not, so single layers can be filled in
  // any order. Only a drop that misses the layers falls back to the lowest empty one.
  const slot=el.closest('#editBench .slot'); if(slot) return {el:slot,t:+slot.dataset.t,s:+slot.dataset.s};
  const tube=el.closest('#editBench .tube'); if(tube){ const t=+tube.dataset.t; const s=ED.cells[t].lastIndexOf(null); return {el:tube,t,s:s>-1?s:null}; }
  return null;
}
function startDrag(e,key,btn){
  if(e.button>0) return; e.preventDefault();
  DR={key,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,target:null,id:e.pointerId};
  try{btn.setPointerCapture(e.pointerId);}catch(_){}

}
function moveDrag(e){

  if(!DR.moved){ DR.moved=true; document.body.classList.add('dragging');
    const g=document.createElement('div'); g.className='ghost';
    if(DR.key==='?'){g.style.background='var(--hidden)';g.textContent='?';}
    else if(DR.key==='erase'){g.style.background='var(--paper)';g.style.color='var(--ink)';g.style.fontSize='12px';g.textContent=tr('eraseLabel');}
    else g.style.background=PALETTE[DR.key][2];
    document.body.appendChild(g); DR.ghost=g; }
  DR.ghost.style.left=e.clientX+'px'; DR.ghost.style.top=e.clientY+'px';
  const tg=dropTarget(e.clientX,e.clientY);
  if(DR.target&&(!tg||tg.el!==DR.target.el)) DR.target.el.classList.remove('drop');
  if(tg) tg.el.classList.add('drop'); DR.target=tg;
}
function finishDrag(){ if(!DR) return; if(DR.ghost) DR.ghost.remove(); if(DR.target) DR.target.el.classList.remove('drop'); document.body.classList.remove('dragging'); DR=null; }
function endDrag(e){
  if(!DR||e.pointerId!==DR.id) return;
  const {key,moved}=DR, tg=moved?dropTarget(e.clientX,e.clientY):null; finishDrag();
  brush=key;
  if(moved&&tg&&tg.s!==null){ UNSURE.delete(tg.t+','+tg.s); ED.cells[tg.t][tg.s]=key==='erase'?null:key; saveEd(); renderEditor(); }
  else if(moved&&tg&&tg.s===null&&key!=='erase'){ setBrushNote(tr('full',tg.t+1)); renderBrushes(true); return; }
  renderBrushes();
}
function cancelDrag(){ finishDrag(); }
function setBrushNote(t){ $('brushName').textContent=t; }

[$('fewer'),$('more')].forEach(b=>b.onclick=()=>{
  const n=Math.max(2,Math.min(24,ED.cells.length+(+b.dataset.d)));
  if(n>ED.cells.length) ED.cells.push(Array(CAP).fill(null)); else ED.cells.length=n;
  saveEd(); renderEditor(); });
$('clearBoard').onclick=()=>{ UNSURE.clear(); ED.cells=blank(ED.cells.length); saveEd(); renderEditor(); };
$('exampleBoard').onclick=()=>{ UNSURE.clear(); ED=decode(EXAMPLE); saveEd(); renderEditor(); };

// ---------------- walkthrough ----------------
let P,SV,COL,UNSEEN,S=null,hist,sel,fresh,busy=false,bannerMsg=null;
// COL[code] = palette index (null for an unseen color not yet named)
function startWalk(banner){
  const res=check(); if(res.errors.length) return;
  P=res.puzzle; UNSEEN=P.unseen;
  COL={}; Object.entries(P.colors).forEach(([k,v])=>COL[k]=v.pi);
  SV=makeSolver(CAP,P.pool,UNSEEN);
  hist=[]; sel=null; fresh=null; noteMsg=null; bannerMsg=banner||null;
  S={tubes:P.start.map(t=>t.slice()),node:{m:[]},i:0,ask:null,moves:0,found:[],naming:null};
  $('setup').hidden=true; $('walk').hidden=false; window.scrollTo(0,0);
  withWork(()=>{ S.node=planFrom(S.tubes,[]); });
}
$('startWalk').onclick=()=>startWalk();
const toPalette=code=>COL[code]??15;
function boardFrom(tubes){ return tubes.map(t=>{ const top=t.slice().reverse().map(c=>c[0]==='?'?'?':toPalette(c)); return Array(CAP-top.length).fill(null).concat(top); }); }
function backToEdit(){
  if(S){ ED={cells:boardFrom(S.tubes)}; UNSURE.clear(); saveEd(); }
  $('walk').hidden=true; $('setup').hidden=false; renderEditor(); window.scrollTo(0,0);
}
$('editAgain').onclick=backToEdit;
// Same return to the editor, but straight into picking a new screenshot.
$('reshoot').onclick=()=>{ backToEdit(); $('shotInput').click(); };
// Restarting the level keeps every uncovered color showing: rebuild the starting board with them filled in.
function restartLevel(){
  const found=Object.fromEntries(S.found);
  const tubes=P.start.map(t=>t.map(c=>c[0]==='?'&&found[+c.slice(1)]!==undefined?found[+c.slice(1)]:c));
  const n=S.found.length;
  ED={cells:boardFrom(tubes)}; UNSURE.clear(); saveEd();
  startWalk(['restarted',n]);
}
function worldBudget(){ return SV.countPerms(P.pool)<=150?150:80; }
function planFrom(tubes,found){
  const visited=new Set(hist.map(h=>SV.key(h.tubes)).concat(SV.key(tubes)));
  const {seg}=SV.planSegment(tubes,Object.fromEntries(found),visited,worldBudget(),Date.now()+20000);
  if(seg.r) seg.r.opts=seg.colors; delete seg.colors; return seg;
}
function withWork(fn){ busy=true; renderWalk(); setTimeout(()=>{fn(); busy=false; renderWalk();},30); }
function snap(){return {tubes:S.tubes.map(t=>t.slice()),i:S.i,ask:S.ask,node:S.node,moves:S.moves,found:S.found.slice(),col:{...COL}};}
function restore(s){ COL=s.col; S={...s,tubes:s.tubes.map(t=>t.slice()),found:s.found.slice(),naming:null}; delete S.col; }
const hid=c=>c[0]==='?';
const topColor=t=>t[t.length-1];
const isDone=t=>t.length===CAP&&t.every(c=>c===t[0]&&!hid(c));
const nameOfCode=c=>COL[c]==null?tr('newColor').toLowerCase():cname(COL[c]);
const hexOfCode=c=>COL[c]==null?'#8A949A':HEX(COL[c]);
const chipOf=c=>`<span class="chip" style="background:${hexOfCode(c)}"></span>${tr('chip',nameOfCode(c))}`;
const named=c=>COL[c]!=null;
function cur(){ if(busy||S.ask) return null; return S.i<S.node.m.length?S.node.m[S.i]:null; }
function pour(){
  const m=cur(); if(!m) return; hist.push(snap());
  const [a,b,k]=m; fresh={b,k};
  for(let j=0;j<k;j++) S.tubes[b].push(S.tubes[a].pop());
  S.i++; S.moves++;
  if(S.i>=S.node.m.length&&S.node.r) S.ask=S.node.r;
  sel=null; noteMsg=null; renderWalk();
}
function answer(c){
  if(busy) return;
  const r=S.ask, id='?'+r.id;
  S.tubes=S.tubes.map(t=>t.map(x=>x===id?c:x)); S.found.push([r.id,c]); S.ask=null; S.i=0; S.naming=null; fresh=null; noteMsg=null;
  if(!r.b[c]){ const tubes=S.tubes, found=S.found.slice(); withWork(()=>{ r.b[c]=planFrom(tubes,found); S.node=r.b[c]; }); return; }
  S.node=r.b[c]; renderWalk();
}
function back(){ if(busy) return; if(S.naming){S.naming=null;renderWalk();return;} if(!hist.length) return; restore(hist.pop()); fresh=null; sel=null; noteMsg=null; renderWalk(); }
function explain(m){
  const [a,b,k]=m, t=S.tubes, c=topColor(t[a]);
  const say=tr('pourSay',chipOf(c),a+1,b+1,k);
  const after=t.map(x=>x.slice()); for(let j=0;j<k;j++) after[b].push(after[a].pop());
  const why=[], name=nameOfCode(c);
  if(isDone(after[b])) why.push(tr('completes',name));
  else if(t[b].length) why.push(tr('stacks',name));
  else why.push(tr('parking',b+1));
  const na=after[a];
  if(na.length&&hid(topColor(na))) why.push(tr('uncovers',a+1));
  else if(!na.length) why.push(tr('freed',a+1));
  else { const nx=S.node.m[S.i+1];
    if(nx&&nx[1]===a) why.push(tr('exposesNext',chipOf(topColor(na)),a+1));
    else if(nx&&nx[0]===a) why.push(tr('clearsWay',chipOf(topColor(na)))); }
  return {say,why:why.join(' ')};
}
function renderWalk(){
  const t=S.tubes, m=cur();
  renderBench($('walkBench'),t.length,rowsFor(t.length),idx=>{
    const tube=t[idx], btn=document.createElement('button'); btn.type='button'; btn.className='tube';
    if(m&&m[0]===idx) btn.classList.add('src'); if(m&&m[1]===idx) btn.classList.add('dst');
    if(sel===idx) btn.classList.add('sel'); if(S.ask&&S.ask.t===idx) btn.classList.add('ask');
    const g=document.createElement('div'); g.className='glass';
    for(let j=0;j<CAP;j++){ const d=document.createElement('div'); const c=tube[j]; d.className='cell';
      if(c!==undefined){ if(hid(c)){d.classList.add('h');d.textContent='?';} else d.style.background=hexOfCode(c);
        if(fresh&&fresh.b===idx&&j>=tube.length-fresh.k) d.classList.add('new');
        // the uncovered layer is the top one of the tube being asked about
        if(S.ask&&S.ask.t===idx&&j===tube.length-1) d.classList.add('askcell'); }
      g.appendChild(d); }
    const n=document.createElement('span'); n.className='num'; n.textContent=idx+1; btn.append(g,n);
    btn.setAttribute('aria-label',tr('tubeLabel',idx+1,tube.length?tube.slice().reverse().map(c=>hid(c)?tr('hiddenWord'):nameOfCode(c)).join(', '):tr('emptyWord')));
    btn.onclick=()=>tap(idx); return btn; });
  fresh=null;
  const nColors=Object.keys(COL).length, done=t.filter(isDone).length;
  $('tubesDone').textContent=tr('tubesDone',done,nColors);
  $('cnt').textContent=tr('pours',S.moves);
  $('bar').style.width=(done/nColors*100)+'%';
  $('banner').hidden=!bannerMsg; if(bannerMsg) $('banner').textContent=tr(...bannerMsg);
  $('note').textContent=noteMsg?tr(...noteMsg):'';
  const body=$('body'), next=$('next'); $('back').disabled=busy||(!hist.length&&!S.naming);
  if(busy){
    body.innerHTML=`<p class="say">${tr('working')}</p><p class="why">${tr('workingWhy')}</p>`; next.disabled=true; next.textContent=tr('next');
  } else if(S.ask&&S.naming){
    const code=S.naming, used=new Set(Object.values(COL).filter(v=>v!=null));
    const opts=SWATCHES.filter(i=>!used.has(i));
    body.innerHTML=`<p class="say">${tr('whichNew')}</p><p class="why">${tr('whichNewWhy')}</p><div class="picks">${opts.map(i=>`<button class="pick" type="button" data-p="${i}"><span style="background:${HEX(i)}"></span>${up(cname(i))}</button>`).join('')}</div>`;
    body.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{ hist.push(snap()); COL[code]=+p.dataset.p; answer(code); });
    next.disabled=true; next.textContent=tr('pickAbove');
  } else if(S.ask){
    const opts=S.ask.opts||Object.keys(S.ask.b);
    const btn=c=>(UNSEEN.includes(c)&&!named(c))
      ?`<button class="pick" type="button" data-c="${c}" data-new="1"><span class="stripe"></span>${tr('notSeen')}</button>`
      :`<button class="pick" type="button" data-c="${c}"><span style="background:${hexOfCode(c)}"></span>${up(nameOfCode(c))}</button>`;
    body.innerHTML=`<p class="say">${tr('whatColor',S.ask.t+1)}</p><p class="why">${tr('whatColorWhy')}</p><div class="picks">${opts.map(btn).join('')}</div>`;
    body.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{ if(p.dataset.new){S.naming=p.dataset.c;renderWalk();} else { hist.push(snap()); answer(p.dataset.c);} });
    next.disabled=true; next.textContent=tr('pickAbove');
  } else if(m){
    const e=explain(m); body.innerHTML=`<p class="say">${e.say}</p><p class="why">${e.why}</p>`;
    next.disabled=false; next.textContent=tr('next');
  } else if(S.node.stuck){
    body.innerHTML=`<p class="say">${tr('stuckSay')}</p><p class="why">${tr('stuckWhy')}</p><div class="picks"><button class="pick" type="button" id="restartBtn"><span style="background:var(--act)"></span>${tr('restartBtn')}</button></div>`;
    $('restartBtn').onclick=restartLevel; next.disabled=true; next.textContent=tr('waiting');
  } else {
    body.innerHTML=`<p class="say">${tr('solved',S.moves)}</p><p class="why">${tr('solvedWhy')}</p>`;
    next.disabled=true; next.textContent=tr('done');
  }
  const left=P.pool.slice(); S.found.forEach(([,c])=>{const i=left.indexOf(c); if(i>-1) left.splice(i,1);});
  const cnt={}; let newLeft=0; left.forEach(c=>{ if(UNSEEN.includes(c)&&!named(c)) newLeft++; else cnt[c]=(cnt[c]||0)+1; });
  drawArrow(m); askMenu();
  $('pool').innerHTML=left.length?`${tr('stillHidden',left.length)}<div class="chips">${Object.entries(cnt).map(([c,n])=>`<b><span style="background:${hexOfCode(c)}"></span>${up(nameOfCode(c))}${n>1?' ×'+n:''}</b>`).join('')}${newLeft?`<b><span class="stripe"></span>${tr('newLeft',newLeft/CAP)}</b>`:''}</div>`:'';
}
// A curve from the tube being poured out of to the one being poured into, so the pair reads as
// one move rather than two separately coloured tubes.
const SVGNS='http://www.w3.org/2000/svg';
function drawArrow(m){
  const bench=$('walkBench'); const old=bench.querySelector('svg.arrow'); if(old) old.remove();
  if(!m) return;
  const tubes=bench.querySelectorAll('.tube'), a=tubes[m[0]], b=tubes[m[1]];
  if(!a||!b) return;
  const R=bench.getBoundingClientRect(), A=a.getBoundingClientRect(), B=b.getBoundingClientRect();
  const x1=A.left+A.width/2-R.left, y1=A.top-R.top-4;
  const x2=B.left+B.width/2-R.left, y2=B.top-R.top-4;
  const lift=Math.max(24,Math.min(76,Math.abs(x2-x1)*0.32+22));
  // keep the whole curve inside the bench rather than letting it arc out over the panel edge
  const cx=(x1+x2)/2, cy=Math.max(2,Math.min(y1,y2)-lift);
  const svg=document.createElementNS(SVGNS,'svg'); svg.setAttribute('class','arrow'); svg.setAttribute('aria-hidden','true');
  const line=document.createElementNS(SVGNS,'path');
  line.setAttribute('d',`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
  const ang=Math.atan2(y2-cy,x2-cx), h=10;
  const head=document.createElementNS(SVGNS,'path'); head.setAttribute('class','head');
  head.setAttribute('d',`M ${x2} ${y2} L ${x2-h*Math.cos(ang-0.42)} ${y2-h*Math.sin(ang-0.42)} L ${x2-h*Math.cos(ang+0.42)} ${y2-h*Math.sin(ang+0.42)} Z`);
  svg.append(line,head); bench.appendChild(svg);
}
// Every palette colour, so a layer can be named even when the board turns out not to match the
// game. Order is what the puzzle still has most of first, then the rest.
function askChoices(){
  const opts=S.ask.opts||Object.keys(S.ask.b);
  const left=P.pool.slice(); S.found.forEach(([,c])=>{const i=left.indexOf(c); if(i>-1) left.splice(i,1);});
  const cnt={}; left.forEach(c=>cnt[c]=(cnt[c]||0)+1);
  const taken=new Set(Object.values(COL).filter(v=>v!=null));
  const fresh=opts.find(c=>UNSEEN.includes(c)&&!named(c)); // the one unseen colour on offer
  const direct=new Map();
  opts.forEach(c=>{ if(named(c)) direct.set(COL[c],c); });
  const list=SWATCHES.map(i=>{
    if(direct.has(i)){ const c=direct.get(i); return {i,code:c,n:cnt[c]||0,rank:0}; }
    if(fresh&&!taken.has(i)) return {i,code:fresh,name:i,n:cnt[fresh]||0,rank:1};
    return {i,rank:2,n:0};
  });
  const pos=i=>SWATCHES.indexOf(i);
  list.sort((a,b)=>a.rank-b.rank||b.n-a.n||pos(a.i)-pos(b.i));
  return list;
}
// The colours to choose from, put next to the layer in question rather than only in the side panel.
function askMenu(){
  const bench=$('walkBench'); const old=bench.querySelector('.ctxmenu'); if(old) old.remove();
  if(busy||!S.ask||S.naming) return;
  const tubes=bench.querySelectorAll('.tube'), a=tubes[S.ask.t]; if(!a) return;
  const R=bench.getBoundingClientRect(), A=a.getBoundingClientRect();
  const choices=askChoices();
  const el=document.createElement('div'); el.className='ctxmenu';
  // Swatches only, in one short row: a labelled column is tall enough that it ends up covering
  // the very layer being asked about. The names stay in the side panel.
  el.innerHTML=choices.map((ch,k)=>{
    const div=(k>0&&choices[k-1].rank===0&&ch.rank>0)?'<i class="cdiv"></i>':'';
    const label=up(cname(ch.i));
    return div+`<button class="cpick${ch.rank===2?' off':''}" type="button" data-pi="${ch.i}" title="${label}" aria-label="${label}">`+
           `<span style="background:${HEX(ch.i)}"></span></button>`;
  }).join('');
  bench.appendChild(el);
  const w=el.offsetWidth, hh=el.offsetHeight;
  let x=A.left+A.width/2-R.left-w/2;
  x=Math.max(4,Math.min(Math.max(4,bench.clientWidth-w-4),x));
  // Below the tube keeps it clear of the highlighted layer at the top; only go above if there
  // genuinely is not room below and there is more room above.
  let y=A.bottom-R.top+10;
  const below=bench.clientHeight-(A.bottom-R.top)-10, above=A.top-R.top-10;
  if(hh>below&&above>below) y=Math.max(2,A.top-R.top-hh-10);
  el.style.left=x+'px'; el.style.top=y+'px';
  el.querySelectorAll('.cpick').forEach(q=>q.onclick=()=>{
    const ch=choices.find(x=>x.i===+q.dataset.pi);
    if(!ch||ch.rank===2){ note('cantBe',cname(+q.dataset.pi)); return; }
    hist.push(snap());
    if(ch.name!==undefined) COL[ch.code]=ch.i;   // naming a colour not seen before
    answer(ch.code); });
}
addEventListener('resize',()=>{ if(!$('walk').hidden&&S){ drawArrow(cur()); askMenu(); } });
function note(...k){ noteMsg=k; $('note').textContent=tr(...k); }
function tap(idx){
  const m=cur(); if(!m) return;
  if(sel===null){ if(!S.tubes[idx].length||hid(topColor(S.tubes[idx]))){ note('nothingToPour',idx+1); return; } sel=idx; noteMsg=['picked',idx+1]; renderWalk(); return; }
  if(sel===idx){ sel=null; noteMsg=null; renderWalk(); return; }
  if(sel===m[0]&&idx===m[1]){ pour(); return; }
  const was=sel; sel=null; noteMsg=['notNext',was+1,idx+1,m[0]+1,m[1]+1]; renderWalk();
}
$('next').onclick=pour; $('back').onclick=back;
document.addEventListener('keydown',e=>{ if($('walk').hidden) return; if(e.target.closest&&e.target.closest('button.pick,button.tube,input')) return; if(e.key==='ArrowRight') pour(); if(e.key==='ArrowLeft') back(); });

// ---------------- boot ----------------
(function boot(){
  const fromHash=decode(decodeURIComponent(location.hash.slice(1)));
  const saved=decode(store.get('eves-experiment:board')||'');
  ED=fromHash||saved||{cells:blank(12)};
  saveEd(); applyLang();
})();
</script>
</body>
